# Publishes the library to Maven Central when a version tag is pushed

name: Gradle Publish

on:
  push:
    tags:
      - v*.**.*

  workflow_dispatch:

jobs:
  publish:

    runs-on: macos-latest

    permissions:
      contents: write # create GitHub release

    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      # Uploads all modules as a single deployment bundle via Central Portal API,
      # waits for validation and releases it automatically
      - name: Publish with Gradle
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "KStateMachine $GITHUB_REF_NAME" --generate-notes --verify-tag
